name: Build Windows Portable

on:
  push:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build win-x64 portable
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: 24.x
        package-manager-cache: false

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
      with:
        version: 11
        cache: false

    - run: pnpm install --frozen-lockfile
      shell: bash

    - run: pnpm run lint
      shell: bash
      continue-on-error: true

    - run: pnpm run pack
      shell: bash

    - name: Build portable exe
      shell: bash
      run: |
        node --input-type=module -e "
        import { Arch, build, Platform } from 'electron-builder'
        import config from './_scripts/ebuilder.config.mjs'
        await build({ targets: Platform.WINDOWS.createTarget(['portable'], Arch.x64), config, publish: 'never' })
        "

    - name: Upload portable exe
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: freetube-win-x64-portable
        path: build/*.exe
        if-no-files-found: error
